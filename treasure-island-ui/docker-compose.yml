version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-studio-postgres
    environment:
      POSTGRES_DB: ai_studio
      POSTGRES_USER: ai_studio
      POSTGRES_PASSWORD: ai_studio_pw
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_studio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (BullMQ queue backend) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-studio-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Next.js App ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ai-studio-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai_studio:ai_studio_pw@postgres:5432/ai_studio
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - ./public/generated:/app/public/generated
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    name: ai-studio
